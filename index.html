<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dabster | Dettaglio Offerta</title>
  <meta name="description" content="Prototipo desktop della schermata Dati Offerta del gestionale Dabster" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="top-icon" aria-label="Menu">☰</button>
    <div class="logo-wrap">
      <div class="logo">dabster</div>
      <div class="logo-sub">human crafted engineering</div>
    </div>
    <button class="top-icon" aria-label="Altre opzioni">⋮</button>
  </header>

  <main class="page-shell">
    <div class="page-title">Offerta</div>
    <div class="breadcrumb">
      <span>⌂</span><span>›</span><span>Offerte</span><span>›</span><strong>Dettaglio</strong>
    </div>

    <section class="main-card">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="dati">▣&nbsp;&nbsp;Dati Offerta</button>
        <button class="tab" data-tab="risorse">♧&nbsp;&nbsp;Risorse Esterne <span class="badge">0</span></button>
      </div>

      <div id="tab-dati" class="tab-panel active">
        <section class="accordion general open">
          <button class="section-head" type="button">
            <span>▣&nbsp;&nbsp;Dati Generali</span><span class="chevron">⌄</span>
          </button>
          <div class="section-body">
            <div class="grid general-grid">
              <label class="field col-4">
                <span>Commessa</span>
                <select>
                  <option>26_119 - CONSULENZA ANTINCENDIO GENERALI</option>
                </select>
              </label>

              <label class="field col-5">
                <span>Contratto <b class="plus">＋</b></span>
                <div class="inline-control">
                  <select>
                    <option>Seleziona un elemento</option>
                  </select>
                  <button class="square-btn" type="button" title="Aggiorna">↻</button>
                  <button class="folder-btn" type="button">↗ Apri cartella</button>
                </div>
              </label>

              <div class="field important col-3">
                <span>Importante</span>
                <button id="star" class="star" type="button" aria-pressed="false">★</button>
              </div>

              <label class="field col-5">
                <span>Titolo</span>
                <input value="CONSULENZA ANTINCENDIO GENERALI" />
              </label>

              <label class="field col-3">
                <span>Codice *</span>
                <input value="26_119pe01" />
              </label>

              <label class="field col-2">
                <span>Stato</span>
                <select><option>Completata</option><option>In lavorazione</option><option>Inviata</option></select>
              </label>

              <label class="field col-2">
                <span>Referente tecnico</span>
                <select><option>Seleziona un elemento</option></select>
              </label>

              <label class="field col-4">
                <span>Servizi associati *</span>
                <div class="tag-input"><span class="tag">Consulenza antincendio ×</span></div>
              </label>
            </div>
          </div>
        </section>

        <section class="accordion dates open">
          <button class="section-head" type="button">
            <span>▦&nbsp;&nbsp;Date</span><span class="chevron">⌄</span>
          </button>
          <div class="section-body">
            <div class="grid">
              <label class="field col-4">
                <span>Data offerta *</span>
                <div class="date-control">
                  <input value="08/07/2026" />
                  <button type="button" class="square-btn">▦</button>
                </div>
              </label>
            </div>
          </div>
        </section>

        <section class="accordion amounts open">
          <button class="section-head" type="button">
            <span>€&nbsp;&nbsp;Importi Offerta</span><span class="chevron">⌄</span>
          </button>
          <div class="section-body">
            <div class="grid amounts-top">
              <label class="field col-5">
                <span>Importo stimato *</span>
                <div class="money-control"><input class="money" data-value="5100" value="5.100,00" /><span>€</span></div>
              </label>
              <label class="field col-5">
                <span>Importo opere</span>
                <div class="money-control"><input class="money" data-value="0" value="0,00" /><span>€</span></div>
              </label>
              <label class="field col-5">
                <span>Importo offerta * <em>(calcolato)</em></span>
                <div class="money-control disabled"><input id="totaleOfferta" value="5.100,00" disabled /><span>€</span></div>
              </label>
            </div>

            <div class="detail-title">♟&nbsp;&nbsp;DETTAGLIO</div>
            <div class="grid detail-grid">
              <label class="field col-4">
                <span>Consulenza</span>
                <div class="money-control"><input value="0,00" /><span>€</span></div>
              </label>
              <label class="field col-4">
                <span>Progetti</span>
                <div class="money-control"><input value="5.100,00" /><span>€</span></div>
              </label>
              <label class="field col-4">
                <span>Direzione lavori</span>
                <div class="money-control"><input value="0,00" /><span>€</span></div>
              </label>
            </div>
          </div>
        </section>

        <section class="accordion notes open">
          <button class="section-head" type="button">
            <span>▰&nbsp;&nbsp;Note</span><span class="chevron">⌄</span>
          </button>
          <div class="section-body">
            <label class="field">
              <textarea rows="4" placeholder="Note"></textarea>
            </label>
          </div>
        </section>

        <footer class="form-footer">
          <div class="audit">
            <span>Creato da SIDI il 08/07/2026 14:46:42</span>
            <span>Modificato da SIDI il 18/08/2026 17:11:58</span>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" type="button">✕ Annulla</button>
            <button class="btn btn-primary" type="button">✓ Salva e Chiudi</button>
          </div>
        </footer>
      </div>

      <div id="tab-risorse" class="tab-panel empty-panel">
        <div>Nessuna risorsa esterna associata.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
