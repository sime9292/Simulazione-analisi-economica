name: E2E Manual Dashboard
on:
  push:
    branches: [clean-v3-demo]
    paths:
      - 'v89.html'
      - 'v89-bootstrap.js'
      - 'app-v89.js'
      - 'offer-lines-v63.js'
      - 'offer-flow-v38.js'
      - 'billing-dashboard-live-v87.js'
      - 'tests/e2e-dashboard-manual.py'
      - '.github/workflows/e2e-dashboard-manual.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install selenium
      - name: Start local app
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8000' -WorkingDirectory '${{ github.workspace }}'
          Start-Sleep -Seconds 2
      - name: Run manual offer -> dashboard E2E
        run: python tests/e2e-dashboard-manual.py
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dashboard-failure
          path: artifacts/
          if-no-files-found: ignore
