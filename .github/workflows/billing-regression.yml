name: Billing regression

on:
  push:
    branches: [clean-v2]
    paths:
      - 'clean/billing-domain.js'
      - 'billing-workspace-v39.js'
      - 'tests/billing-regression.mjs'
      - '.github/workflows/billing-regression.yml'
  workflow_dispatch:

jobs:
  billing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser billing script syntax
        run: node --check billing-workspace-v39.js
      - name: Run invoice allocation regression scenarios
        run: node tests/billing-regression.mjs
